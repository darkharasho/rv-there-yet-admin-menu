; RVAdminMenu configuration

; Hotkey to toggle the admin menu overlay.
; Must be one of: F1-F12, INSERT, HOME, END, DELETE, PAGE_UP, PAGE_DOWN.
; An unrecognized value falls back to the default and logs a warning.
; Note: only F1-F12 are confirmed working. The spellings of the non-function
; keys are taken from UE4SS's key table and have not yet been verified against
; a running game; if one of them does not bind, the mod logs a warning and you
; should use an F-key until it is confirmed.
; Default: F3
Hotkey = F3

; Logging verbosity for the mod's own log messages.
; One of: DEBUG, INFO, WARN, ERROR. An unrecognized value falls back to INFO.
; Default: INFO
LogLevel = INFO

; Whether destructive actions (kill, revive-all, etc.) prompt for confirmation
; before running. Accepts: 1/true/yes/on or 0/false/no/off.
; Default: true
ConfirmDestructive = true

; Amount healed per use of the heal action. Clamped to the range 1-1000.
; Default: 100
HealAmount = 100
